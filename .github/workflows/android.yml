name: Build DeltaPulse 50x Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Collect App UI Files into www/
        run: |
          mkdir -p android-build/www
          if [ -d "www" ]; then
            cp -r www/* android-build/www/
          elif [ -d "public" ]; then
            cp -r public/* android-build/www/
          elif [ -d "DeltaPulse-50x-NiftyStyle/www" ]; then
            cp -r DeltaPulse-50x-NiftyStyle/www/* android-build/www/
          elif [ -f "index.html" ]; then
            cp index.html styles.css app.js manifest.json android-build/www/ 2>/dev/null || true
          else
            echo "Error: index.html / www folder not found!" && exit 1
          fi
          ls -la android-build/www/

      - name: Build Capacitor Android Project & Debug APK
        working-directory: android-build
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 --no-audit --no-fund
          npx cap init "DeltaPulse 50x" "com.deltapulse.nifty50x" --web-dir=www
          npx cap add android
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            const perms = `<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application`;
            xml = xml.replace("<application", perms);
            fs.writeFileSync(p, xml);
          '
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: DeltaPulse-50x-Android-APK
          path: android-build/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
